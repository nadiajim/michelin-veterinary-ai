services:
  - type: web
    name: michelin-veterinary-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn michelin_core.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MICHELIN_TRIAGE_MODEL
        value: gemini-2.5-flash
      - key: MICHELIN_CROSS_EXAM_MODEL
        value: gemini-2.5-pro
